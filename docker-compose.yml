services:
  postgres:
    image: postgres:16-alpine
    container_name: elise-postgres-${PROFILE:-mrs}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elise_clone
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - elise_data_${PROFILE:-mrs}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  elise_data_mrs:
  elise_data_emr:
